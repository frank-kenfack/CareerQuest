name: CareerQuest CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "devops/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  schema-and-infra-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run schema and infrastructure tests
        run: python -m unittest discover -s tests -v

  backend-django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careerquest
          POSTGRES_USER: careerquest_user
          POSTGRES_PASSWORD: careerquest_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies and run Django tests
        working-directory: backend
        env:
          POSTGRES_DB: careerquest
          POSTGRES_USER: careerquest_user
          POSTGRES_PASSWORD: careerquest_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test -v 2

  frontend-vitest-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies, test and build
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build
