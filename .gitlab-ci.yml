stages:
  - validate
  - test
  - build
  - deploy

variables:
  POSTGRES_DB: careerquest
  POSTGRES_USER: careerquest_user
  POSTGRES_PASSWORD: careerquest_password
  POSTGRES_HOST_AUTH_METHOD: trust

schema-and-infra-tests:
  stage: validate
  image: python:3.12-slim
  script:
    - python -m unittest discover -s tests -v

backend-django-tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  script:
    - cd backend
    - pip install --no-cache-dir -r requirements.txt
    - python manage.py check
    - python manage.py test -v 2

frontend-vitest-and-build:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm test
    - npm run build

docker-build-images:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  script:
    - docker build -t careerquest-backend:${CI_COMMIT_SHORT_SHA:-latest} ./backend
    - docker build -t careerquest-frontend:${CI_COMMIT_SHORT_SHA:-latest} ./frontend

deploy-production:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - sh scripts/deploy-k8s.sh
