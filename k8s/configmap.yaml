apiVersion: v1
kind: ConfigMap
metadata:
  name: careerquest-config
  namespace: careerquest
data:
  POSTGRES_DB: "careerquest"
  POSTGRES_USER: "careerquest_user"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,careerquest.local"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://careerquest.local"
