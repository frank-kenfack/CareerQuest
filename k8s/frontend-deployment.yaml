apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerquest-frontend
  namespace: careerquest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careerquest-frontend
  template:
    metadata:
      labels:
        app: careerquest-frontend
    spec:
      containers:
        - name: frontend
          image: careerquest-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
